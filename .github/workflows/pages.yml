name: Deploy Dokka to GitHub Pages

# Both halves of the site are rebuilt from the tips of their branches on every run, whichever branch
# triggered it - so a push to either one leaves the whole site current.
on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release (master)
        uses: actions/checkout@v7
        with:
          ref: master
          path: master-src

      - name: Checkout snapshot (dev)
        uses: actions/checkout@v7
        with:
          ref: dev
          path: dev-src

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate release docs
        working-directory: master-src
        run: ./gradlew dokkaGenerateHtml

      - name: Generate snapshot docs
        working-directory: dev-src
        run: ./gradlew dokkaGenerateHtml

      # The version is bumped on master as the last step of a release, so dev carries the number of
      # the release it is ahead of. The snapshot is labelled by its commit instead.
      - name: Extract version labels
        id: versions
        run: |
          RELEASE_VERSION=$(grep -oP 'version = "\K[^"]+' master-src/build.gradle.kts | head -1)
          SNAPSHOT_COMMIT=$(git -C dev-src rev-parse --short HEAD)
          echo "release=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "snapshot=dev @ $SNAPSHOT_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Assemble site
        run: |
          mkdir -p site/snapshot site/release
          cp -r dev-src/build/dokka/html/. site/snapshot/
          cp -r master-src/build/dokka/html/. site/release/
          sed \
            -e "s/{{SNAPSHOT_VERSION}}/${{ steps.versions.outputs.snapshot }}/g" \
            -e "s/{{RELEASE_VERSION}}/${{ steps.versions.outputs.release }}/g" \
            dev-src/.github/pages/index.html > site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
