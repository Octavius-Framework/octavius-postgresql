name: Build and Test

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'docs/**'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: octavius_test
          POSTGRES_PASSWORD: 1234
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # `pg-model` is the multiplatform module and so has no `test` task at all - `test` alone builds its jar
      # and runs none of its tests. `allTests` is the aggregate over both targets it publishes.
      - name: Run Tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/octavius_test
          DB_USERNAME: postgres
          DB_PASSWORD: 1234
        run: ./gradlew test :pg-model:allTests

  test-ssl:
    runs-on: ubuntu-latest
    # Which protocols and cipher suites are on by default belongs to the JDK, not to the driver, and
    # it is the one thing here that moves between releases - so this job runs on the version the
    # driver declares as its floor and on the current one. Everything else in the suite behaves the
    # same on both and is not worth running twice.
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate SSL certificates and start Postgres
        run: |
          mkdir -p .ssl
          cd .ssl
          
          # 1. Generate Root CA
          openssl req -new -x509 -days 365 -nodes -out ca.crt -keyout ca.key -subj "/CN=root-ca"
          
          # 2. Generate Server Certificate
          openssl req -new -nodes -out server.csr -keyout server.key -subj "/CN=localhost"
          openssl x509 -req -in server.csr -days 365 -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt
          
          # 3. Generate Client Certificate
          openssl req -new -nodes -out client.csr -keyout client.key.tmp -subj "/CN=postgres"
          openssl x509 -req -in client.csr -days 365 -CA ca.crt -CAkey ca.key -CAcreateserial -out client.crt
          
          # 4. Convert client key to PKCS8 format for Java
          openssl pkcs8 -topk8 -inform PEM -outform PEM -in client.key.tmp -out client.key -nocrypt

          # 5. A second client certificate on an EC key, so the algorithm the driver reads off the
          #    certificate is something other than RSA at least once.
          openssl ecparam -name prime256v1 -genkey -noout -out client-ec.key.tmp
          openssl req -new -key client-ec.key.tmp -out client-ec.csr -subj "/CN=postgres"
          openssl x509 -req -in client-ec.csr -days 365 -CA ca.crt -CAkey ca.key -CAcreateserial -out client-ec.crt
          openssl pkcs8 -topk8 -inform PEM -outform PEM -in client-ec.key.tmp -out client-ec.key -nocrypt

          # 6. The RSA client key again, encrypted, for the sslpassword test - same certificate.
          openssl pkcs8 -topk8 -inform PEM -outform PEM -in client.key -out client-enc.key -passout pass:senatus
          
          chmod 600 server.key ca.key client.key client-ec.key client-enc.key
          sudo chown 999:999 server.key server.crt ca.crt
          cd ..
          
          docker run -d --name postgres-ssl \
            -e POSTGRES_PASSWORD=1234 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=octavius_test \
            -p 5433:5432 \
            -v ${{ github.workspace }}/.ssl:/etc/ssl/postgres \
            postgres:18 -c ssl=on -c ssl_cert_file=/etc/ssl/postgres/server.crt -c ssl_key_file=/etc/ssl/postgres/server.key -c ssl_ca_file=/etc/ssl/postgres/ca.crt
          
          until docker exec postgres-ssl pg_isready -h localhost; do sleep 1; done

          # A role the server must ask for a cleartext password, the way an ldap/pam/radius setup
          # does. Both a TLS and a plaintext rule, so the tests can check the driver answers over
          # one and refuses over the other. pg_hba is first-match, so these go on top.
          docker exec postgres-ssl psql -U postgres -c "CREATE ROLE cleartext_user LOGIN PASSWORD 'senatus'"
          HBA=$(docker exec postgres-ssl psql -U postgres -tAc "SHOW hba_file")
          docker exec postgres-ssl bash -c "{ echo 'hostssl all cleartext_user all password'; echo 'host all cleartext_user all password'; cat $HBA; } > /tmp/hba && cp /tmp/hba $HBA"
          docker exec postgres-ssl psql -U postgres -c "SELECT pg_reload_conf()"

      - name: Run SSL Tests
        env:
          TEST_SSL: "true"
          DB_URL: jdbc:postgresql://localhost:5433/octavius_test
          DB_USERNAME: postgres
          DB_PASSWORD: 1234
          SSL_ROOT_CERT: ${{ github.workspace }}/.ssl/ca.crt
          SSL_CERT: ${{ github.workspace }}/.ssl/client.crt
          SSL_KEY: ${{ github.workspace }}/.ssl/client.key
          SSL_CERT_EC: ${{ github.workspace }}/.ssl/client-ec.crt
          SSL_KEY_EC: ${{ github.workspace }}/.ssl/client-ec.key
          SSL_KEY_ENCRYPTED: ${{ github.workspace }}/.ssl/client-enc.key
          SSL_KEY_PASSWORD: senatus
        run: ./gradlew :driver:test --tests "*SslIntegrationTest*" --tests "*ChannelBindingIntegrationTest*"

  test-pg17:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: octavius_test
          POSTGRES_PASSWORD: 1234
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Unsupported Version Test
        env:
          TEST_UNSUPPORTED_PG_VERSION: "true"
        run: ./gradlew :driver:test --tests "*UnsupportedVersionTest*"

  test-spring-example:
    runs-on: ubuntu-latest
    # `examples/spring-app` has a build of its own and is not part of the root one, so nothing
    # compiles it unless this job does - and compiling is not what it is for. Everything the example
    # demonstrates is decided at runtime: the template and the transaction manager come from
    # auto-configuration, the composites and the enum are registered against OIDs created after the
    # context started, and both deliberate failures are the server's, translated on the way out. So
    # the job boots it against a real server and asserts over HTTP.

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: octavius_example
          POSTGRES_PASSWORD: 1234
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # A database of its own: the example's schema bootstrap drops what it creates, which is not
      # something to point at the database the rest of the suite is using.
      - name: Run Example Smoke Test
        working-directory: examples/spring-app
        env:
          SPRING_DATASOURCE_URL: jdbc:octavius://localhost:5432/octavius_example
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: 1234
        run: ./gradlew test
